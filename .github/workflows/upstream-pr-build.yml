# Upstream PR build gate (fork-side, dispatch-only).
#
# Purpose: give the clean upstream PR branches (e.g. pr/upstream-resolution-dpi,
# opened on diasurgical as PR #8746) a linkable, artifact-producing build that
# proves they compile and pass tests as plain upstream - no GPU scaler, no fork
# payload, and no fork CI file inside the PR itself.
#
# Why dispatch-only, and why this file does NOT live on the pr/* branch:
# merge-plan-r3 section 6.4 / merge-plan-r4 forbid CI yml from riding an
# upstream PR - a .github/workflows file on the PR branch would show up in the
# PR's diff against diasurgical:master. This workflow lives on the default
# branch instead and checks out the target ref by name at run time, so the PR
# branch stays byte-identical to the reviewable change.
#
# Recipes: the two jobs are upstream's own Linux_x86_64_SDL3_test.yml and
# Windows_MSVC_x64.yml (as present on the pr/* branches, inherited from
# diasurgical:master) mirrored 1:1 - same runner, dependencies, GCC version,
# vcpkg commit, CMakePresets and test data - minus every fork-specific flag.
# No USE_GPU_SCALER flag is passed on purpose: the target ref must configure,
# build and test exactly like a vanilla upstream tree.
#
# Run: Actions -> "Upstream PR build (no scaler)" -> Run workflow (the ref
# input defaults to pr/upstream-resolution-dpi), or:
#
#   gh workflow run upstream-pr-build.yml --ref master \
#     -f ref=pr/upstream-resolution-dpi
#
# Then link the run URL from the PR description as the "clean upstream build"
# proof; the Windows job uploads a runnable devilutionx.exe package.

name: Upstream PR build (no scaler)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to build (default: the resolution-DPI upstream PR branch)'
        required: false
        default: 'pr/upstream-resolution-dpi'
        type: string
      run_windows:
        description: 'Also run the Windows MSVC x64 job'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  linux-x64-sdl3:
    name: Linux x64 SDL3 (upstream recipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake curl g++-14 git libgtest-dev libgmock-dev libbenchmark-dev libsodium-dev libpng-dev libbz2-dev libasound2-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxkbcommon-dev wget

    - name: Switch to GCC 14
      run: |
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
        sudo update-alternatives --set gcc /usr/bin/gcc-14

    # Upstream's Linux_x86_64_SDL3_test.yml build line, verbatim. No caching
    # here on purpose: a proof build should always be a clean-tree build.
    # -DDEVILUTIONX_SYSTEM_BENCHMARK=OFF works around:
    #   lto1: fatal error: bytecode stream in file
    #   '/usr/lib/x86_64-linux-gnu/libbenchmark_main.a' generated with LTO
    #   version 11.2 instead of the expected 11.3
    - name: Build tests
      run: |
        cmake -S. -Bbuild -G Ninja -DUSE_SDL3=ON -DDEVILUTIONX_SYSTEM_SDL3=OFF -DDEVILUTIONX_STATIC_SDL3=ON -DDEVILUTIONX_SYSTEM_SDL_IMAGE=OFF -DDEVILUTIONX_SYSTEM_BENCHMARK=OFF
        wget -qnc https://github.com/diasurgical/devilutionx-assets/releases/download/v2/spawn.mpq -P build
        cmake --build build -j $(nproc)

    - name: Run tests
      run: cd build && ctest --output-on-failure

    - name: Upload binary
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: devilutionx-linux-x64-sdl3
        path: build/devilutionx
        if-no-files-found: ignore

  windows-msvc-x64:
    name: Windows MSVC x64 (upstream recipe)
    runs-on: windows-latest
    timeout-minutes: 120
    if: ${{ inputs.run_windows }}
    # Upstream's Windows_MSVC_x64.yml sets contents: write for the vcpkg
    # dependency-graph submission (VCPKG_FEATURE_FLAGS=dependencygraph).
    permissions:
      contents: write

    env:
      VCPKG_FEATURE_FLAGS: dependencygraph
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2

    - name: Install latest CMake
      uses: lukka/get-cmake@latest

    - name: Restore or setup vcpkg
      uses: lukka/run-vcpkg@v11.6
      with:
        vcpkgGitCommitId: '40f3c709db80acf154ac4b17a1f83c564ebd022e'

    - name: Fetch test data
      run: |
          mkdir build-ninja-vcpkg-relwithdebinfo
          Invoke-WebRequest -Uri "https://github.com/diasurgical/devilutionx-assets/releases/download/v2/spawn.mpq" -OutFile "build-ninja-vcpkg-relwithdebinfo/spawn.mpq" -Resume

    - name: Get CMakePresets.json
      run: cp Packaging/windows/CMakePresets.json .

    - name: Run CMake consuming CMakePresets.json and vcpkg.json by mean of vcpkg.
      uses: lukka/run-cmake@v10
      with:
        configurePreset: 'ninja-vcpkg-relwithdebinfo'
        buildPreset: 'ninja-vcpkg-relwithdebinfo'
        testPreset: 'ninja-vcpkg-relwithdebinfo'

    - name: Upload-Package
      uses: actions/upload-artifact@v7
      with:
        name: devilutionx-windows-x64
        path: |
            build-ninja-vcpkg-relwithdebinfo/devilutionx.exe
            build-ninja-vcpkg-relwithdebinfo/bz2.dll
            build-ninja-vcpkg-relwithdebinfo/libpng16.dll
            build-ninja-vcpkg-relwithdebinfo/libsodium.dll
            build-ninja-vcpkg-relwithdebinfo/SDL2.dll
            build-ninja-vcpkg-relwithdebinfo/SDL2_image.dll
            build-ninja-vcpkg-relwithdebinfo/zlib1.dll
